<body>
    <span id="ha-waarde">--</span> CPM
    <div id="status"></div>

<article class=”my-article”>
<header>
 <h2> Do you love to code? </h2>
</header>
<p> Here’s where I learned coding from - Geeks for Geeks. Get your coding skills sharpened here </p>
</article>




    
    <script>
        async function laadGitHubData() {
            try {
                // We voegen een unieke 'cache-buster' timestamp toe zodat de browser altijd de nieuwste data ophaalt
                const response = await fetch(`./data.json?t=${new Date().getTime()}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                
                const json = await response.json();
                // We gaan ervan uit dat je JSON-bestand er zo uitziet: {"state": "waarde"}
                document.getElementById('ha-waarde').innerText = json.state + " - " + json.date;
                document.getElementById('status').innerText = ""; 
            } catch (error) {
                console.error(error);
                document.getElementById('ha-waarde').innerText = "--";
                document.getElementById('status').innerText = "Fout: " + error.message;
            }
        }

        // Direct laden en elke 15 seconden verversen
        laadGitHubData();
        setInterval(laadGitHubData, 60000);
    </script>
</body>
</html>
