<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Grail Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      display: grid;
      min-height: 100vh;
      /* Defines 3 rows: auto header, flexible middle, auto footer */
      grid-template-rows: auto 1fr auto;
      /* Defines 3 columns: 200px left nav, flexible main, 200px right aside */
      grid-template-columns: 200px 1fr 200px;
      grid-template-areas:
        "header header header"
        "nav    main   aside"
        "footer footer footer";
    }

    header {
      grid-area: header;
      background-color: #1e293b;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    nav {
      grid-area: nav;
      background-color: #f1f5f9;
      padding: 1.5rem;
      border-right: 1px solid #cbd5e1;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    nav a {
      text-decoration: none;
      color: #0f172a;
      font-weight: 500;
    }

    main {
      grid-area: main;
      padding: 2rem;
      background-color: #ffffff;
    }

    aside {
      grid-area: aside;
      background-color: #f8fafc;
      padding: 1.5rem;
      border-left: 1px solid #cbd5e1;
    }

    footer {
      grid-area: footer;
      background-color: #1e293b;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    /* Stack columns vertically on mobile screens */
    @media (max-width: 768px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto auto;
        grid-template-areas:
          "header"
          "nav"
          "main"
          "aside"
          "footer";
      }

      nav, aside {
        border: none;
        border-bottom: 1px solid #cbd5e1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Site Header</h1>
  </header>

  <nav>
    <h2>Navigation</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Articles</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h2>Main Content</h2>
    <p>This central area expands to fill the remaining horizontal and vertical space between the sidebars, header, and footer.</p>
  </main>

  <aside>
    <h2>Sidebar</h2>
    <p>Place related links, ads, or author info here.</p>
  </aside>

  <footer>
    <p>&copy; 2026 Website Footer</p>
  </footer>

</body>
</html>
